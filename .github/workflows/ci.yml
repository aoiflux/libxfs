name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go:
          ["1.21.x", "1.22.x", "1.23.x", "1.24.x", "1.25.x", "1.26.x", "stable"]
        exclude:
          # Keep the matrix affordable: the older releases only need to prove
          # that the declared go.mod floor still builds, which one OS shows.
          - os: windows-latest
            go: "1.22.x"
          - os: windows-latest
            go: "1.23.x"
          - os: windows-latest
            go: "1.24.x"
          - os: windows-latest
            go: "1.25.x"
          - os: macos-latest
            go: "1.22.x"
          - os: macos-latest
            go: "1.23.x"
          - os: macos-latest
            go: "1.24.x"
          - os: macos-latest
            go: "1.25.x"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: Build
        run: go build ./...
      - name: Build examples
        run: go build ./examples/...
      - name: Test
        run: go test ./...

  quality:
    name: vet, format and race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true
      # A short run per target. This is a regression guard against newly
      # introduced panics, not a fuzzing campaign.
      - name: Fuzz parsers
        run: |
          for target in \
            FuzzParseDirectoryBlockRecords \
            FuzzParseShortFormDirectoryEntries \
            FuzzParseExtentList \
            FuzzParseSuperblock \
            FuzzParseInode \
            FuzzParseBlockDirectoryEntriesEnd
          do
            echo "== $target =="
            go test -run '^$' -fuzz "^${target}$" -fuzztime 30s .
          done
